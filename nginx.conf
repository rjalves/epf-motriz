server {
  listen 80;
  root /usr/share/nginx/html;

  # SPA: /painel e /responder/... servem o index.html
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
